<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>eye-care-u 设置窗口效果图 · 半透明玻璃</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0B0C10; font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;
         display:flex; gap:64px; padding:40px 44px 36px; align-items:flex-start;
         -webkit-font-smoothing:antialiased; }
  .col { display:flex; flex-direction:column; gap:14px; align-items:center; }
  .tag { color:#818896; font-size:13px; letter-spacing:2px; }
  .sub { color:#565C68; font-size:11px; letter-spacing:1px; margin-top:-6px; }

  .scene { width:700px; height:452px; border-radius:14px; position:relative;
           overflow:hidden; outline:1px solid rgba(255,255,255,.08); }

  /* 场景一：深色彩色桌面（模糊色斑模拟壁纸/窗口内容） */
  .dark { background:
    radial-gradient(420px 300px at 18% 28%, rgba(152,182,178,.42), transparent 62%),
    radial-gradient(520px 360px at 78% 74%, rgba(139,92,246,.48), transparent 62%),
    radial-gradient(380px 280px at 82% 18%, rgba(236,72,153,.34), transparent 62%),
    radial-gradient(360px 260px at 12% 84%, rgba(59,130,246,.4), transparent 62%),
    #10141C; }
  /* 场景二：浅色桌面 */
  .light { background:
    radial-gradient(420px 300px at 20% 30%, rgba(152,182,178,.5), transparent 62%),
    radial-gradient(500px 340px at 78% 72%, rgba(167,139,250,.4), transparent 62%),
    radial-gradient(360px 260px at 82% 20%, rgba(249,168,212,.4), transparent 62%),
    linear-gradient(135deg,#EDF0F6,#DFE5EF); }

  /* 半透明玻璃窗口（方案 B） */
  .win { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
         width:440px; border-radius:10px; overflow:hidden;
         background:rgba(19,20,24,.58);
         backdrop-filter:blur(26px) saturate(1.35);
         -webkit-backdrop-filter:blur(26px) saturate(1.35);
         outline:1px solid rgba(255,255,255,.14);
         box-shadow:0 24px 60px rgba(0,0,0,.4); }
  .titlebar { height:34px; background:rgba(30,32,40,.5);
              display:flex; align-items:center; padding:0 4px 0 14px;
              border-bottom:1px solid rgba(255,255,255,.07); }
  .titlebar .t { font-size:12px; color:#C3C8D3; flex:1; }
  .titlebar .g { display:flex; color:#9BA1AD; font-size:11px; }
  .titlebar .g span { width:40px; height:34px; display:flex; align-items:center; justify-content:center; }
  .titlebar .g span:last-child { color:#D3D7E0; }

  .pane { padding:20px 24px 22px; }
  .head { display:flex; align-items:baseline; }
  .head b { font-size:14px; font-weight:600; color:#F2F3F7; letter-spacing:.5px; }
  .head .st { margin-left:auto; font-size:11px; color:#9BA2B0; }
  .head .st i { display:inline-block; width:6px; height:6px; border-radius:50%;
                background:#8BE3AB; margin-right:6px; vertical-align:1px;
                box-shadow:0 0 6px rgba(139,227,171,.5); }

  .line { display:flex; align-items:center; gap:10px; padding:14px 0 17px;
          border-bottom:1px solid rgba(255,255,255,.09); margin-bottom:20px; }
  .sw { width:18px; height:18px; border-radius:6px;
        background:linear-gradient(135deg,#B8CFCB,#98B6B2);
        box-shadow:0 1px 6px rgba(0,0,0,.3); }
  .hex { font-size:13px; font-weight:600; color:#F0F2F6; letter-spacing:.5px;
         font-variant-numeric:tabular-nums; }
  .s { margin-left:auto; font-size:12px; color:#9BA2B0; }
  .s b { color:#F0F2F6; font-weight:600; font-variant-numeric:tabular-nums; }

  .rows { display:flex; flex-direction:column; gap:19px; margin-bottom:24px; }
  .row { display:grid; grid-template-columns:58px 1fr 40px; align-items:center; gap:14px; }
  .lab { font-size:12px; color:#A3A9B6; }
  .val { font-size:12px; color:#F2F4F8; text-align:right; font-variant-numeric:tabular-nums; }
  .track { position:relative; height:16px; display:flex; align-items:center; }
  .track::before { content:""; position:absolute; left:0; right:0; height:4px;
                   border-radius:2px; background:rgba(255,255,255,.16); }
  .pill { position:absolute; height:4px; border-radius:2px;
          background:linear-gradient(90deg,rgba(201,205,214,.75),#CDD1DA); }
  .knob { position:absolute; width:14px; height:14px; border-radius:50%;
          background:#F2F4F8; transform:translateX(-50%);
          box-shadow:0 2px 7px rgba(0,0,0,.45); }

  .btns { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .btn { height:42px; border-radius:12px; display:flex; align-items:center;
         justify-content:center; font-size:13px; font-weight:600; letter-spacing:1px; }
  .btn.pri { background:#F2F4F8; color:#17181D; box-shadow:0 4px 14px rgba(0,0,0,.3); }
  .btn.sec { border:1px solid rgba(255,255,255,.16); color:#C6CBD6; }
</style>
</head>
<body>

  <div class="col">
    <div class="tag">方案 B · 半透明玻璃（深色桌面）</div>
    <div class="sub">亚克力模糊背后内容 · 文字保持实色</div>
    <div class="scene dark">
      <div class="win">
        <div class="titlebar"><span class="t">护眼遮罩 - 设置</span>
          <span class="g"><span>—</span><span>□</span><span>✕</span></span></div>
        <div class="pane">
          <div class="head"><b>护眼遮罩</b><span class="st"><i></i>遮罩运行中</span></div>
          <div class="line">
            <span class="sw"></span><span class="hex">#98B6B2</span>
            <span class="s">强度 <b>0.55</b></span>
          </div>
          <div class="rows">
            <div class="row"><span class="lab">R 红色</span>
              <div class="track"><div class="pill" style="width:59.6%"></div>
                <div class="knob" style="left:59.6%"></div></div>
              <span class="val">152</span></div>
            <div class="row"><span class="lab">G 绿色</span>
              <div class="track"><div class="pill" style="width:71.4%"></div>
                <div class="knob" style="left:71.4%"></div></div>
              <span class="val">182</span></div>
            <div class="row"><span class="lab">B 蓝色</span>
              <div class="track"><div class="pill" style="width:69.8%"></div>
                <div class="knob" style="left:69.8%"></div></div>
              <span class="val">178</span></div>
            <div class="row"><span class="lab">强度</span>
              <div class="track"><div class="pill" style="width:55%"></div>
                <div class="knob" style="left:55%"></div></div>
              <span class="val">55%</span></div>
          </div>
          <div class="btns">
            <div class="btn pri">停止遮罩</div>
            <div class="btn sec">关闭窗口</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="tag">方案 B · 半透明玻璃（浅色桌面）</div>
    <div class="sub">亮背景下的可读性验证</div>
    <div class="scene light">
      <div class="win">
        <div class="titlebar"><span class="t">护眼遮罩 - 设置</span>
          <span class="g"><span>—</span><span>□</span><span>✕</span></span></div>
        <div class="pane">
          <div class="head"><b>护眼遮罩</b><span class="st"><i></i>遮罩运行中</span></div>
          <div class="line">
            <span class="sw"></span><span class="hex">#98B6B2</span>
            <span class="s">强度 <b>0.55</b></span>
          </div>
          <div class="rows">
            <div class="row"><span class="lab">R 红色</span>
              <div class="track"><div class="pill" style="width:59.6%"></div>
                <div class="knob" style="left:59.6%"></div></div>
              <span class="val">152</span></div>
            <div class="row"><span class="lab">G 绿色</span>
              <div class="track"><div class="pill" style="width:71.4%"></div>
                <div class="knob" style="left:71.4%"></div></div>
              <span class="val">182</span></div>
            <div class="row"><span class="lab">B 蓝色</span>
              <div class="track"><div class="pill" style="width:69.8%"></div>
                <div class="knob" style="left:69.8%"></div></div>
              <span class="val">178</span></div>
            <div class="row"><span class="lab">强度</span>
              <div class="track"><div class="pill" style="width:55%"></div>
                <div class="knob" style="left:55%"></div></div>
              <span class="val">55%</span></div>
          </div>
          <div class="btns">
            <div class="btn pri">停止遮罩</div>
            <div class="btn sec">关闭窗口</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
