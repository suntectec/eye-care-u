# Release 流水线：推送 v* tag → PyInstaller 构建 exe →（可选）SignPath 签名 → 发布 GitHub Release。
#
# 签名步骤由 SIGNPATH_API_TOKEN 密钥门控：未配置时照常产出未签名 exe；
# SignPath Foundation 过审后，在仓库 Settings 中配置即自动启用签名：
#   Secrets: SIGNPATH_API_TOKEN        （SignPath CI 用户 API token）
#   Variables: SIGNPATH_ORGANIZATION_ID（SignPath 组织 ID）
# project-slug / signing-policy-slug / artifact-configuration-slug
# 需与 SignPath 控制台中创建的名称一致。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: pip install pyinstaller pillow

      - name: Regenerate multi-size ico from logo.png
        run: python tools/make_ico.py

      - name: Build exe (PyInstaller)
        run: >
          python -m PyInstaller --onefile --noconsole --name eye-care-u
          --icon assets/logo.ico --add-data "assets/logo.png;assets" eye_care_u.py

      - name: Upload artifact for signing
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: eye-care-u
          path: dist/eye-care-u.exe

      - name: Submit signing request (SignPath Foundation)
        id: sign
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: eye-care-u
          signing-policy-slug: release-signing
          artifact-configuration-slug: onefile-exe
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          output-artifact-directory: signed

      - name: Verify Authenticode signature
        if: steps.sign.conclusion == 'success'
        shell: cmd
        run: signtool verify /pa /v signed\eye-care-u.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = if (Test-Path 'signed/eye-care-u.exe') { 'signed/eye-care-u.exe' } else { 'dist/eye-care-u.exe' }
          gh release create "$env:GITHUB_REF_NAME" $exe `
            --title "Eye Care U $env:GITHUB_REF_NAME" --generate-notes
